<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Discord All Badges</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #1e1f22;
      color: #f2f3f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border-bottom: 1px solid #35363c;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #badgeList {
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #badgeList::-webkit-scrollbar {
      width: 6px;
    }
    #badgeList::-webkit-scrollbar-track {
      background: #1e1f22;
    }
    #badgeList::-webkit-scrollbar-thumb {
      background: #2b2d31;
      border-radius: 4px;
    }
    #badgeList::-webkit-scrollbar-thumb:hover {
      background: #4e5058;
    }

    .badge-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 6px;
      background-color: #2b2d31;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    .badge-item:hover {
      background-color: #35363c;
    }

    .badge-item:active {
      transform: scale(0.99);
    }

    .badge-item img {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      border-radius: 4px;
      object-fit: contain;
    }

    .badge-text {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #dbdee1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #80848e;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #23a55a;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }
  </style>
</head>
<body>
  <h1>Settings</h1>
  <div id="badgeList"></div>
  <script src="popup.js"></script>
  <p>Made by 清冰みらい</p>
</body>
</html>
